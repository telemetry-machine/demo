# Only the recommender runs. It writes CPU and memory advice into each
# VerticalPodAutoscaler's status and changes no pods. The cluster Collector
# sends those objects to the k8s_resources dataset.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vertical-pod-autoscaler
  namespace: vpa-system
spec:
  interval: 1h
  chart:
    spec:
      chart: vertical-pod-autoscaler
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: autoscaler
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    admissionController:
      enabled: false
    updater:
      enabled: false
    recommender:
      enabled: true
      replicas: 1
      podDisruptionBudget:
        enabled: false
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi

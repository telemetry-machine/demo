# Advice only (updateMode Off): the recommender writes CPU and memory
# recommendations into each VPA's status and changes no pods.
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: accounting
  namespace: otel-demo
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: accounting
  updatePolicy:
    updateMode: "Off"

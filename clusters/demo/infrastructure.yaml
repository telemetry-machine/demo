# The Collectors that send the cluster's own telemetry (Kubernetes events,
# metrics and objects) to Telemetry Machine, and the VPA recommender.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure
  prune: true
  wait: true
  # Fills ${TM_INGEST_KEY} in the Secrets from the flux-system/telemetry-machine
  # Secret, which you create once. The key never enters Git.
  postBuild:
    substituteFrom:
      - kind: Secret
        name: telemetry-machine

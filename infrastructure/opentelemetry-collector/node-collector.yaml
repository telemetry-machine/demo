# One Collector per node. It sends node, pod and container metrics from the
# kubelet, and the host's CPU, memory, disk and network metrics, to the
# k8s_metrics dataset.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-collector
  namespace: opentelemetry
  annotations:
    # See cluster-collector.yaml.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  interval: 1h
  chart:
    spec:
      chart: opentelemetry-collector
      version: 0.178.1
      sourceRef:
        kind: HelmRepository
        name: open-telemetry
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    mode: daemonset
    image:
      repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
      tag: 0.164.0
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        memory: 256Mi
    ports:
      otlp:
        enabled: false
      otlp-http:
        enabled: false
      jaeger-compact:
        enabled: false
      jaeger-thrift:
        enabled: false
      jaeger-grpc:
        enabled: false
      zipkin:
        enabled: false
    presets:
      kubeletMetrics:
        enabled: true
      hostMetrics:
        enabled: true
      kubernetesAttributes:
        enabled: true
        extractAllPodLabels: true
        extractAllPodAnnotations: true
    extraEnvs:
      - name: TM_INGEST_KEY
        valueFrom:
          secretKeyRef:
            name: telemetry-machine
            key: ingest-key
    clusterRole:
      create: true
      rules:
        - apiGroups: [""]
          resources: [nodes/proxy]
          verbs: [get]
        - apiGroups: [""]
          resources: [nodes]
          verbs: [get, list]
    config:
      receivers:
        otlp: null
        jaeger: null
        zipkin: null
        prometheus: null
        kubeletstats:
          collection_interval: 30s
          insecure_skip_verify: true
          metric_groups: [node, pod, container, volume]
          metrics:
            container.uptime:
              enabled: true
            k8s.container.cpu_limit_utilization:
              enabled: true
            k8s.container.cpu_request_utilization:
              enabled: true
            k8s.container.memory_limit_utilization:
              enabled: true
            k8s.container.memory_request_utilization:
              enabled: true
            k8s.node.uptime:
              enabled: true
            k8s.pod.cpu_limit_utilization:
              enabled: true
            k8s.pod.cpu_request_utilization:
              enabled: true
            k8s.pod.memory_limit_utilization:
              enabled: true
            k8s.pod.memory_request_utilization:
              enabled: true
            k8s.pod.uptime:
              enabled: true
        hostmetrics:
          collection_interval: 30s
          root_path: /hostfs
          scrapers:
            cpu:
              metrics:
                system.cpu.utilization:
                  enabled: true
            filesystem:
              metrics:
                system.filesystem.utilization:
                  enabled: true
            memory:
              metrics:
                system.memory.utilization:
                  enabled: true
      processors:
        # See cluster-collector.yaml.
        resource_detection/system:
          detectors: [env, system]
          override: false
          system:
            resource_attributes:
              host.name:
                enabled: false
        # Takes the node's name from the Kubernetes API.
        resource_detection/k8s_api:
          detectors: [k8s_api]
          override: false
      exporters:
        debug: null
        otlp_http/k8s_metrics:
          endpoint: https://api.telemetrymachine.com
          headers:
            X-API-Key: ${env:TM_INGEST_KEY}
            X-Dataset-Name: k8s_metrics
      service:
        pipelines:
          traces: null
          logs: null
          metrics:
            receivers: [kubeletstats, hostmetrics]
            processors: [k8s_attributes, memory_limiter, resource_detection/system, resource_detection/k8s_api, batch]
            exporters: [otlp_http/k8s_metrics]
